<style>
  /* ============================================================
     PALETTE / DESIGN TOKENS — modifier ici pour changer les couleurs
     ============================================================ */
  :root {
    --ink: #2B2118;
    --ink-soft: #6b5d4f;
    --wine: #7A1F3D;
    --wine-dark: #5A1530;
    --gold: #B8862B;
    --gold-soft: #E4C77A;
    --leaf: #4B5842;
    --paper: #F6F0E4;
    --card: #FFFDF8;
    --line: #E4D8C3;
    --shadow: 0 1px 2px rgba(43,33,24,0.06), 0 8px 24px rgba(43,33,24,0.06);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(122,31,61,0.05) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(184,134,43,0.06) 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }

  .header-logo {
  position: Relative;
  top: 0px;
  left: 0px;
  height: 70px;
  width: auto;
}

  /* ---------- EN-TÊTE ---------- */
  header.top { padding: 56px 24px 40px; text-align: center; position: relative; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--wine); font-weight: 600; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(32px, 5vw, 52px);
    line-height: 1.05; margin: 0 0 12px; color: var(--ink);
  }
  h1 em { color: var(--wine); font-style: italic; font-weight: 500; }
  .sub { font-size: 16px; color: var(--ink-soft); max-width: 560px; margin: 0 auto; line-height: 1.55; }
  .vine-rule { width: 72px; height: 3px; margin: 22px auto 0; background: linear-gradient(90deg, var(--gold), var(--wine)); border-radius: 3px; }

  /* ---------- ONGLETS (jours + carte) ---------- */
  .day-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 40px 0 8px; }
  .day-tab {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card);
    color: var(--ink-soft); cursor: pointer; transition: all 0.18s ease; text-transform: capitalize;
  }
  .day-tab:hover { border-color: var(--gold); color: var(--ink); }
  .day-tab.active { background: var(--wine); border-color: var(--wine); color: #fff; box-shadow: var(--shadow); }
  .day-tab .count { opacity: 0.65; font-weight: 500; margin-left: 5px; }
  .day-tab.map-tab { border-color: var(--leaf); }
  .day-tab.map-tab.active { background: var(--leaf); border-color: var(--leaf); }

  .helper-text { text-align: center; font-size: 13.5px; color: var(--ink-soft); margin: 18px 0 36px; }
  .helper-text strong { color: var(--wine); }

  /* ---------- FRISE (vue par jour) ---------- */
  .timeline { position: relative; margin-top: 28px; }
  .timeline::before {
    content: ''; position: absolute; left: 68px; top: 8px; bottom: 8px; width: 2px;
    background: repeating-linear-gradient(180deg, var(--gold-soft) 0, var(--gold-soft) 6px, transparent 6px, transparent 12px);
  }
  .stop { position: relative; display: grid; grid-template-columns: 68px 1fr; gap: 20px; margin-bottom: 18px; }
  .stop-time {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: var(--wine-dark);
    text-align: right; padding-top: 16px; position: relative;
  }
  .stop-time::after {
    content: ''; position: absolute; right: -25px; top: 21px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--paper); box-shadow: 0 0 0 2px var(--gold);
  }
  .stop-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); }
  .stop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .stop-commune { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: var(--ink); }
  .stop-site { font-size: 13.5px; color: var(--wine); font-weight: 500; }
  .stop-addr { font-size: 13px; color: var(--ink-soft); margin: 4px 0 10px; }
  .stop-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .stop-meta .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--leaf); display: block; margin-bottom: 2px; }
  .stop-meta .col { flex: 1; min-width: 180px; }

  /* ---------- GRILLE (vue "tous les points") ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 28px; }
  .site-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .site-card .stop-commune { font-size: 18px; }
  .site-card .stop-addr { margin-bottom: 12px; }
  .day-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .day-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 4px 9px;
    border-radius: 999px; background: rgba(75,88,66,0.1); color: var(--leaf); text-transform: capitalize;
  }
  .day-badge b { color: var(--wine-dark); font-weight: 700; }

  /* ---------- CARTE (vue "Carte") ---------- */
  .map-toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 24px 0 16px; }
  .map-filter {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    cursor: pointer; text-transform: capitalize;
  }
  .map-filter:hover { border-color: var(--leaf); }
  .map-filter.active { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .map-intro {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    margin: 24px 0 12px;
  }
  .map-intro-title {
    font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: var(--ink);
  }
  .map-intro-note { font-size: 12.5px; color: var(--ink-soft); }
  #map-container {
    height: 820px; width: 100%; max-width: 620px; margin: 0 auto;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .map-table-wrap {
    margin-top: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  }
  .map-table-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px 9px; border-bottom: 1px solid var(--line); }
  .map-table-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
  .map-table-count { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .map-table {
    width: 100%; min-width: 480px; border-collapse: collapse; font-size: 13px;
  }
  .map-table th {
    padding: 10px 14px; text-align: left; font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--leaf); background: rgba(75,88,66,0.06); border-bottom: 1px solid var(--line);
  }
  .map-table td {
    padding: 9px 14px; border-bottom: 1px solid rgba(228,216,195,0.65); vertical-align: middle;
  }
  .map-table tbody tr:last-child td { border-bottom: 0; }
  .map-table tbody tr:hover { background: rgba(122,31,61,0.035); }
  .map-table .num {
    width: 42px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--wine);
  }
  .map-table .commune { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .map-table .site { color: var(--wine); font-weight: 500; }
  .map-table .days { color: var(--ink-soft); }
  .map-table .hours { color: var(--ink-soft); white-space: nowrap; }
  .map-table .navette { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--wine-dark); white-space: nowrap; }
  .map-number {
    width: 28px; height: 28px; border-radius: 50%; background: var(--wine); color: #fff;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;

  .leaflet-popup-content-wrapper { border-radius: 10px; font-family: 'Work Sans', sans-serif; }
  .popup-commune { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--ink); }
  .popup-site { font-size: 12.5px; color: var(--wine); margin: 2px 0 4px; }
  .popup-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .popup-meta .label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--leaf); }
  .marker-pin {

    text-align: center; margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line);

  @media (max-width: 560px) {
    .timeline::before { left: 52px; }
    .stop { grid-template-columns: 52px 1fr; gap: 14px; }
    .stop-time { font-size: 12px; }
    .stop-time::after { right: -19px; }
    #map-container { height: 620px; max-width: 100%; }
    .map-intro { display: block; }
    .map-intro-note { margin-top: 3px; }
    .map-table th, .map-table td { padding: 8px 9px; }
    .map-table th:nth-child(5), .map-table td:nth-child(5) { display: none; }
    .map-table th, .map-table td { font-size: 12px; }
  }
</style>

const DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi'];
let current = 'carte'; // vue affichée au chargement : 'carte' | 'tous' | 'lundi'...
let mapInstance = null;
let mapMarkers = [];
let mapDayFilter = 'tous';

/* ---------------- Onglets ---------------- */
function renderTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';

  const mapBtn = document.createElement('button');
  mapBtn.className = 'day-tab map-tab' + (current === 'carte' ? ' active' : '');
  mapBtn.textContent = '🗺 Carte';
  mapBtn.onclick = () => { current = 'carte'; render(); };
  tabs.appendChild(mapBtn);

  const allBtn = document.createElement('button');
  allBtn.className = 'day-tab' + (current === 'tous' ? ' active' : '');
  allBtn.innerHTML = 'Tous les points';
  allBtn.onclick = () => { current = 'tous'; render(); };
  tabs.appendChild(allBtn);

  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (current === d ? ' active' : '');
    btn.innerHTML = d ;
    btn.onclick = () => { current = d; render(); };
    tabs.appendChild(btn);
  });
}

/* ---------------- Vue "par jour" (frise chronologique) ---------------- */
function renderDayView(day) {
  const stops = DATA.by_day[day];
  const el = document.createElement('div');
  el.className = 'timeline';
  stops.forEach(s => {
    const stop = document.createElement('div');
    stop.className = 'stop';
    stop.innerHTML = `
      <div class="stop-time">${s.navette || '—'}</div>
      <div class="stop-card">
        <div class="stop-head">
          <span class="stop-commune">${s.commune}</span>
          <span class="stop-site">${s.site}</span>
        </div>
        <div class="stop-addr">${s.adresse || ''}</div>
        <div class="stop-meta">
          <div class="col"><span class="label">Horaires de dépôt</span>${s.horaires || '—'}</div>
          <div class="col"><span class="label">Lieu de dépôt</span>${s.lieu_depot || '—'}</div>
        </div>
      </div>`;
    el.appendChild(stop);
  });
  return el;
}

/* ---------------- Vue "tous les points" (grille de fiches) ---------------- */
function renderAllView() {
  const el = document.createElement('div');
  el.className = 'grid';
  DATA.all_sites.forEach(s => {
    const card = document.createElement('div');
    card.className = 'site-card';
    const badges = s.jours_navette.map(jn =>
      jn.jours.map(j => `<span class="day-badge">${j} <b>${jn.navette || ''}</b></span>`).join('')
    ).join('');
    card.innerHTML = `
      <div class="stop-head">
        <span class="stop-commune">${s.commune}</span>
      </div>
      <div class="stop-site" style="margin-bottom:4px;">${s.site}</div>
      <div class="stop-addr">${s.adresse || ''}</div>
      <div class="stop-meta">
        <div class="col"><span class="label">Horaires de dépôt</span>${s.horaires || '—'}</div>
        <div class="col"><span class="label">Lieu de dépôt</span>${s.lieu_depot || '—'}</div>
      </div>
      <div class="day-badges">${badges}</div>`;
    el.appendChild(card);
  });
  return el;
}

/* ---------------- Vue "Carte" (Leaflet, focus vallée du Rhône) ---------------- */
function renderMapView() {
  const el = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'map-toolbar';
  const filters = ['tous', ...DAYS];
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'map-filter' + (mapDayFilter === f ? ' active' : '');
    btn.textContent = f === 'tous' ? 'Tous les jours' : f;
    btn.onclick = () => { mapDayFilter = f; renderMapMarkers(); renderMapTable(); updateMapFilterButtons(); };
    btn.dataset.filter = f;
    toolbar.appendChild(btn);
  });
  el.appendChild(toolbar);

  const intro = document.createElement('div');
  intro.className = 'map-intro';

  const mapDiv = document.createElement('div');
  mapDiv.id = 'map-container';
  el.appendChild(mapDiv);

  const tableWrap = document.createElement('div');
  tableWrap.className = 'map-table-wrap';
  tableWrap.id = 'map-table-wrap';
  el.appendChild(tableWrap);
  // Le conteneur n'est pas encore dans le DOM global ici : on lui passe donc directement la cible.
  renderMapTable(tableWrap);

  // Le rendu Leaflet doit se faire une fois le div inséré dans le DOM.
  setTimeout(initMap, 0);

  return el;
}
function renderMapTable(targetWrap) {
  const wrap = targetWrap || document.getElementById('map-table-wrap');
  if (!wrap) return;

  const points = mapDayFilter === 'tous' ? DATA.all_sites : DATA.by_day[mapDayFilter];
  const title = mapDayFilter === 'tous' ? 'Toutes les collectes' : `Collectes du ${mapDayFilter}`;

  wrap.innerHTML = `
    <div class="map-table-heading">
      <span class="map-table-title">${title}</span>
      <span class="map-table-count">${points.length} point${points.length > 1 ? 's' : ''}</span>
    </div>
    <div class="table-scroll">
    <table class="map-table">
      <thead>
        <tr>
          <th>N°</th>
          <th>Commune</th>
          <th>Lieu de collecte</th>
          <th>Navette</th>
        </tr>
      </thead>
      <tbody>
        ${points.map(p => {
          const number = DATA.all_sites.findIndex(s => s.commune === p.commune && s.site === p.site) + 1;
          const navette = mapDayFilter === 'tous'
            ? p.jours_navette.map(jn => `${jn.jours.join('/')} : ${jn.navette || '—'}`).join(' · ')
            : (p.navette || '—');
          return `
            <tr>
              <td class="num">${number}</td>
              <td class="commune">${p.commune}</td>
              <td class="site">${p.site}</td>
              <td class="navette">${navette}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

function updateMapFilterButtons() {
  document.querySelectorAll('.map-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === mapDayFilter);
  });
}

function initMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapInstance = L.map('map-container', { scrollWheelZoom: true }).setView([44.15, 4.98], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(mapInstance);
  renderMapMarkers();
}

function renderMapMarkers() {
  if (!mapInstance) return;
  mapMarkers.forEach(m => mapInstance.removeLayer(m));
  mapMarkers = [];

  const points = mapDayFilter === 'tous' ? DATA.all_sites : DATA.by_day[mapDayFilter];
  const bounds = [];

  points.forEach(p => {
    if (p.lat == null || p.lng == null) return;

    // Le numéro est calculé à partir de DATA.all_sites : aucune numérotation
    // à maintenir manuellement lorsque vous ajoutez/supprimez un point.
    const pointNumber = DATA.all_sites.findIndex(s =>
      s.commune === p.commune && s.site === p.site
    ) + 1;

    const markerIcon = L.divIcon({
      className: '',
      html: `<div class="map-number">${pointNumber}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
    });

    const marker = L.marker([p.lat, p.lng], { icon: markerIcon }).addTo(mapInstance);
    const jourInfo = mapDayFilter === 'tous'
      ? p.jours_navette.map(jn => jn.jours.join('/') + ' ' + (jn.navette || '')).join(' · ')
      : (p.navette || '');
    marker.bindPopup(
      '<div class="popup-commune">' + p.commune + '</div>' +
      '<div class="popup-site">' + p.site + '</div>' +
      '<div class="popup-meta"><span class="label">Navette</span> ' + jourInfo + '</div>' +
      '<div class="popup-meta">' + (p.adresse || '') + '</div>'
    );
    mapMarkers.push(marker);
    bounds.push([p.lat, p.lng]);
  });

  if (bounds.length) {
    mapInstance.invalidateSize();
    mapInstance.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  }
}

/* ---------------- Rendu principal ---------------- */
function render() {
  renderTabs();
  const helper = document.getElementById('helperText');
  helper.style.display = current === 'carte' ? 'none' : 'block';

  const content = document.getElementById('content');
  content.innerHTML = '';
  if (current === 'carte') {
    content.appendChild(renderMapView());
  } else if (current === 'tous') {
    content.appendChild(renderAllView());
  } else {
    content.appendChild(renderDayView(current));
  }
}

render();
</script>
